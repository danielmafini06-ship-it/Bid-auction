<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Simulador - BidAuction</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 50px; background-color: #f4f4f9; }
        .painel { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); max-width: 400px; margin: auto; }
        h1 { color: #d9534f; font-size: 48px; margin: 10px 0; }
        input { padding: 10px; font-size: 18px; width: 60%; margin-bottom: 15px; text-align: center; border: 1px solid #ccc; border-radius: 5px; }
        button { background: #5cb85c; color: white; border: none; padding: 15px 20px; font-size: 18px; cursor: pointer; border-radius: 5px; width: 100%; font-weight: bold; }
        button:hover { background: #4cae4c; }
    </style>
</head>
<body>
    <div class="painel">
        <h2>Lote 01: Epiphone SG Special</h2>
        <p id="status">Aguardando lances...</p>
        <h1 id="valor_atual">R$ 1500.00</h1>
        
        <input type="number" id="valor_lance" placeholder="Digite o valor" value="1550">
        <button onclick="darLance()">Enviar Lance Livre</button>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io(); 

        function darLance() {
            const input = document.getElementById('valor_lance');
            const valor = parseFloat(input.value);
            
            if(valor > 0) {
                socket.emit('enviar_lance', { valor: valor });
            }
        }

        socket.on('atualizar_painel', (dados) => {
            // O toLocaleString formata automaticamente para R$ 10.000,00
            document.getElementById('valor_atual').innerText = dados.valor.toLocaleString('pt-BR', { 
                style: 'currency', 
                currency: 'BRL' 
            });
            
            const status = document.getElementById('status');
            status.innerText = dados.mensagem;
            
            if (dados.mensagem.includes("rejeitado")) {
                status.style.color = "red";
            } else {
                status.style.color = "green";
            }
        });
    </script>
</body>
</html>
